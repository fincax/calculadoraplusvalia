name: CI (tests y build)

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests del motor fiscal
        run: npm test

      - name: Build de producción
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        # La versión debe coincidir con playwright-core (package.json).
        run: npx playwright@1.62.1 install --with-deps chromium

      - name: Build de producción
        run: npm run build

      - name: Arrancar el servidor
        run: |
          npm start -- --port 3000 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Smoke E2E (Chromium)
        run: node scripts/smoke-e2e.mjs
